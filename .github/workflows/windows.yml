# AutoTune for Windows: every push to main, and every pull request, builds and tests the PC app on Windows; a pull
# request keeps the installer as a downloadable artifact. On main, a version not released yet (APP_VERSION_NAME in
# gradle.properties) also publishes the installer as a GitHub *pre-release* tagged windows-vX.Y.Z, so Obtainium, which
# follows the full releases, keeps installing only the phone's APK.
name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Test the shared link and the PC app
        run: ./gradlew :dsp:test :link:test :desktop:test --console=plain

      - name: Build the installer
        run: ./gradlew :desktop:packageMsi --console=plain

      - name: Keep the installer with this run
        uses: actions/upload-artifact@v4
        with:
          name: AutoTune-windows-msi
          path: desktop/build/compose/binaries/main/msi/*.msi
          retention-days: 14

      - name: Publish it when this version is new
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's/^APP_VERSION_NAME=//p' gradle.properties | tr -d '\r')
          tag="windows-v$v"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released"
            exit 0
          fi
          msi=$(ls desktop/build/compose/binaries/main/msi/*.msi)
          cp "$msi" "AutoTune-$v-windows.msi"
          gh release create "$tag" "AutoTune-$v-windows.msi" \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "AutoTune for Windows $v" \
            --notes "The PC side of AutoTune: the phone measures, the PC plays each speaker and keeps the EQ in Equalizer APO. Install it, open it, and pair from the phone (Tune › Speakers on a TV or PC). See CHANGELOG.md for what changed."
