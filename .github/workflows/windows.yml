# AutoTune for Windows: every push to main, and every pull request, builds and tests the PC app on Windows; a pull
# request keeps the installer as a downloadable artifact. On main, the installer is added to the same version's Android
# release (android-vX.Y.Z+code, made by DevStore) as AutoTune-X.Y.Z-windows.msi. There is never a release of its own:
# Obtainium looks at the newest release only, so every release must carry the APK. It installs .apk files and ignores
# the .msi.
name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Test the shared link and the PC app
        run: ./gradlew :dsp:test :link:test :desktop:test --console=plain

      - name: Build the installer
        run: ./gradlew :desktop:packageMsi --console=plain

      - name: Keep the installer with this run
        uses: actions/upload-artifact@v4
        with:
          name: AutoTune-windows-msi
          path: desktop/build/compose/binaries/main/msi/*.msi
          retention-days: 14

      - name: Add the installer to this version's Android release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's/^APP_VERSION_NAME=//p' gradle.properties | tr -d '\r')
          code=$(sed -n 's/^APP_VERSION_CODE=//p' gradle.properties | tr -d '\r')
          tag="android-v$v+$code"
          msi="AutoTune-$v-windows.msi"
          # DevStore makes the Android release at the same time (about 3 minutes): wait for it
          for i in $(seq 1 45); do
            gh release view "$tag" >/dev/null 2>&1 && break
            sleep "${WAIT_SECONDS:-20}"
          done
          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::There is no release $tag: DevStore has not released this version (versionCode bumped?)"
            exit 1
          fi
          assets=$(gh release view "$tag" --json assets -q '.assets[].name')
          if grep -qxF "$msi" <<<"$assets"; then
            echo "$tag already has $msi"
          else
            cp desktop/build/compose/binaries/main/msi/*.msi "$msi"
            gh release upload "$tag" "$msi"
          fi
          # 2.14.0 first went out as its own windows-v release, the newest one without an APK, which stopped Obtainium
          if gh release view "windows-v$v" >/dev/null 2>&1; then
            gh release delete "windows-v$v" --cleanup-tag --yes
          fi
